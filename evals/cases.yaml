# One case per catalogue question. Ported from the reference project and re-baselined against this repo's data
# (see docs/eval_rebaseline.md for every case that differs from the reference and why).
#
#   expect:           answer | conflict | abstain | refuse | clarify
#   question / turns: one question, or several turns on one conversation (checks apply to the last turn)
#   must_include:     each entry must appear; "a|b" means either; case-insensitive; commas inside numbers are ignored.
#                     Without a model (retrieval mode) it may be found in the retrieved evidence, including the computed facts.
#   llm_include:      like must_include, but only checked in e2e mode, in the model's own wording
#   must_not_include: none of these may appear in the answer
#   must_cite:        "type:fragment" (a|b allowed): a cited source of that source_type whose title contains the fragment
#   no_llm:           true for cases that must be refused before any model is called
# Only machine IDs, part numbers, counts and similar values are frozen here: no names, no free text from incident forms.

# ------------------------------------------------------------------ N. Nameplates
- id: N1
  tier: 1
  question: "What oil does CNC-02 take?"
  expect: conflict
  must_include: ["VG32"]
  llm_include: ["unconfirmed|not confirmed|not yet confirmed|unresolved|assumption"]
  must_cite: ["nameplate:CNC-02|processed_nameplate:CNC-02|processed_ocr_text:CNC-02", "tabular:HYD-32"]
- id: N2
  tier: 1
  question: "What's the grease interval for the compressor?"
  expect: answer        # the structured OCR field is empty; the raw OCR text of the plate reads "GREASE INTERVAL 500 h"
  must_include: ["500"]
  must_cite: ["nameplate:CMP-01|processed_nameplate:CMP-01|processed_ocr_text:CMP-01"]
- id: N3
  tier: 2
  question: "What lubricant does CNC-03 use?"
  expect: conflict
  must_include: ["VG68"]
  must_cite: ["nameplate:CNC-03|processed_nameplate:CNC-03|processed_ocr_text:CNC-03"]
- id: N4
  tier: 2
  question: "What is the grease interval for CNC-02?"
  expect: answer
  must_include: ["1600"]   # re-baselined: this repo's OCR reads 1600 (unverified); the reference read 1000 with a vision model
  llm_include: ["unverified|OCR|not verified"]
  must_cite: ["nameplate:CNC-02|processed_nameplate:CNC-02|processed_ocr_text:CNC-02"]
- id: N5
  tier: 2
  question: "Which machines use Shell Tonna S3 M68?"
  expect: answer
  must_include: ["BLAST-01", "CMP-01", "WELD-02"]
- id: N6
  tier: 2
  question: "Which machines use ISO VG32?"
  expect: answer
  must_include: ["CNC-02", "MILL-01", "PMP-T01"]   # re-baselined: CNC-01 reads "v632" and CRN-02 has no lubricant text in this repo's OCR
- id: N7
  tier: 3
  question: "When was MILL-01 made, and what is its serial number?"
  expect: answer
  must_include: ["BR1369089", "2015"]
- id: N8
  tier: 1
  question: "What is the capacity of WELD-01?"
  expect: abstain
  must_not_include: ["capacity of WELD-01 is 2000", "WELD-01 has a capacity of 2000"]
- id: N9
  tier: 2
  question: "What is the max load of CRN-01?"
  expect: conflict
  must_include: ["10,000|10000", "SOP-CRANE-02"]
- id: N10
  tier: 2
  question: "What is the max load of CRN-02?"
  expect: conflict      # re-baselined: the plate OCR reads 2080 kg, the SOP says 2,000 kg; the SOP is trusted
  must_include: ["2,000|2000", "SOP-CRANE-02"]

