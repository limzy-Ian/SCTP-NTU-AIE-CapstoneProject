# Offline cases: the invented fixture corpus (tests/fixtures) and a scripted mock model. No MySQL, no network, no cost.
# "reply" is what the mock model says; [[fragment]] becomes the [S#] of the retrieved source whose title has the fragment.
# A list of replies scripts a retry. Without "reply" the case must not reach the model (no client is passed).
- id: O1
  tier: 1
  question: "what is the serial number of TST-01"
  reply: "The serial number is SN-FAKE-01 [[TST-01 / nameplate]]."
  expect: answer
  must_include: ["SN-FAKE-01"]
  must_cite: ["nameplate:TST-01"]
- id: O2
  tier: 1
  question: "what model is TST-02"
  reply: "The plate reads Mill Beta 250 [[TST-02 / nameplate]]."
  expect: conflict
  must_include: ["Mill Beta 250", "Mill Beta 200"]
- id: O3
  tier: 1
  question: "Which oil goes in all the machines?"
  reply: "TST-01 uses Oil-A [[TST-01 / nameplate]]."
  expect: conflict
  must_include: ["not expanded to machines"]
- id: O4
  tier: 1
  question: "show work orders for TST-01"
  expect: answer
  must_include: ["| 9001 |", "| 9002 |"]
- id: O5
  tier: 1
  question: "how many work orders did TST-01 have and what did they cost"
  reply: "TST-01 has 2 work orders with a total cost of 570.50 SGD [[Computed facts]]."
  expect: answer
  must_include: ["2 work orders", "570.50"]
  must_cite: ["computed_facts:Computed facts"]
- id: O6
  tier: 1
  question: "how many work orders did TST-01 have"
  reply: ["TST-01 has 13 work orders [[Computed facts]].", "TST-01 has 2 work orders [[Computed facts]]."]
  expect: answer
  must_include: ["2 work orders"]
  must_not_include: ["13 work orders"]
